<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Search Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css"></head>
<body><main>
<h1>My job search ☕</h1>
<p class="sub" id="greet">Your applications, interviews, and readiness in one place.</p>
<nav aria-label="Views">
  <button data-v="dash" aria-pressed="true">🏠 Dashboard</button>
  <button data-v="int" aria-pressed="false">🎤 Interviews</button>
  <!-- TODO: path assumes calendar_view.html stays in app/main/resources -->
  <a class="navlink" href="../../calendar_view.html">📅 Calendar</a>
</nav>
 
<section id="dash">
  <div class="top">
    <div class="panel"><h2>🗓️ Upcoming interviews</h2><div id="upcoming"></div></div>
    <div class="panel"><h2>✅ Readiness checklist</h2>
      <div><span class="pct" id="pct"></span> <span class="mute" id="pctnote"></span></div>
      <div class="track"><i id="fill"></i></div><div id="checklist"></div></div>
  </div>
  <div class="board" id="board" aria-label="Applications by stage"></div>
</section>
 
<section id="int" class="hide panel"><h2>Interview rounds</h2><div id="rounds"></div></section>
</main>
<script src="mock-data.js"></script>
<script src="dashboard.js"></script></body></html>
